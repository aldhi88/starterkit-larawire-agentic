<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Internal</title>
  <link href="../../public/assets/tabler/dist/css/tabler.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column">
  <div class="page page-center">
    <div class="container container-tight py-4">
      <div class="text-center mb-4"><a href="index.html" class="navbar-brand navbar-brand-autodark">Starterpack</a></div>
      <form class="card card-md" autocomplete="off">
        <div class="card-body">
          <h2 class="h2 text-center mb-1">Login</h2>
          <p class="text-secondary text-center mb-4">Masuk menggunakan akun internal perusahaan.</p>
          <div class="mb-3"><label class="form-label">Username</label><input class="form-control" placeholder="Masukkan username" autocomplete="username"></div>
          <div class="mb-2">
            <label class="form-label">Password</label>
            <div class="input-group input-group-flat"><input type="password" class="form-control" placeholder="Masukkan password" autocomplete="current-password"><button class="btn btn-icon" type="button" aria-label="Tampilkan password">◉</button></div>
          </div>
          <div class="form-footer"><button class="btn btn-primary w-100">Login</button></div>
        </div>
      </form>
      <div class="text-center text-secondary mt-3">Lupa password? Hubungi administrator perusahaan.</div>
    </div>
  </div>
  <script src="../../public/assets/tabler/dist/js/tabler.min.js"></script>
</body>
</html>
